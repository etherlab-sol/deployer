<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contract Monitor</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
  <style>
    :root{--bg:#0d0d0f;--bg2:#141418;--border:#2a2a32;--text:#e8e8ed;--muted:#888894;--accent:#7c6cff;--success:#4ade80;--danger:#ff5c5c}
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:2rem}
    .container{max-width:900px;margin:0 auto}h1{font-family:'Space Grotesk',sans-serif;font-size:1.8rem;margin-bottom:.5rem;text-align:center}
    .sub{text-align:center;color:var(--muted);margin-bottom:2rem;font-size:.9rem}
    .sbox{display:flex;gap:.5rem;margin-bottom:1.5rem}.inp{flex:1;background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:.7rem 1rem;border-radius:8px;font-size:.9rem}.inp:focus{outline:none;border-color:var(--accent)}
    .btn{padding:.7rem 1.5rem;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:all .15s;font-size:.9rem}.btn-p{background:var(--accent);color:#fff}.btn-p:hover{filter:brightness(1.1)}.btn-s{background:var(--success);color:var(--bg)}.btn-sm{padding:.4rem .8rem;font-size:.8rem}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.5rem}.stat{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:1rem;text-align:center}.sv{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700;color:var(--accent)}.sl{font-size:.8rem;color:var(--muted);margin-top:.3rem}
    .clist{display:flex;flex-direction:column;gap:.5rem}.citem{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:1rem}
    .caddr{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--accent);cursor:pointer}.caddr:hover{text-decoration:underline}
    .bal{font-family:'JetBrains Mono',monospace;font-size:.9rem;font-weight:600}.bal.has{color:var(--success)}.bal.no{color:var(--muted)}
    .tag{display:inline-block;padding:.15rem .5rem;border-radius:4px;font-size:.7rem;font-weight:600}.tag-eth{background:rgba(74,222,128,.15);color:var(--success)}.tag-zero{background:rgba(136,136,148,.15);color:var(--muted)}
    .log{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:1rem;margin-top:1.5rem;max-height:200px;overflow-y:auto;font-family:'JetBrains Mono',monospace;font-size:.75rem}
    .le{padding:.2rem 0;border-bottom:1px solid rgba(255,255,255,.05)}.lt{color:var(--muted);margin-right:.5rem}.li{color:var(--muted)}.ls{color:var(--success)}.le2{color:var(--danger)}
    .empty{text-align:center;color:var(--muted);padding:2rem;font-size:.9rem}
    .info-box{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:1rem;margin-bottom:1rem;font-size:.8rem;color:var(--muted)}
  </style>
</head>
<body>
  <div class="container">
    <h1>Contract Monitor</h1>
    <p class="sub">Track deployed contracts and monitor ETH balances</p>
    <div class="info-box"><strong style="color:var(--text)">How to use:</strong><br>Enter a wallet address (deployer) to see all contracts deployed by that address.</div>
    <div class="sbox"><input type="text" id="deployerAddr" class="inp" placeholder="0x... Wallet address"><button class="btn btn-p" id="btnScan">Scan</button></div>
    <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:1rem;font-size:.85rem;color:var(--muted)"><input type="checkbox" id="autoRefresh" checked><label for="autoRefresh">Auto-refresh every 30 seconds</label></div>
    <div class="stats"><div class="stat"><div class="sv" id="totalC">0</div><div class="sl">Contracts</div></div><div class="stat"><div class="sv" id="totalB">0</div><div class="sl">Total ETH</div></div><div class="stat"><div class="sv" id="withEth">0</div><div class="sl">With ETH</div></div></div>
    <div class="clist" id="cList"><div class="empty">Enter a wallet address and click Scan</div></div>
    <div class="log" id="logOut"></div>
  </div>
  <!-- PLACEHOLDER_SCRIPT -->
  <script>
    let provider,contracts=[],logs=[];
    const STORAGE_KEY='etherlab_users';
    const NETWORKS={1:{name:'Ethereum Mainnet',rpc:'https://eth.llamarpc.com',api:'https://api.etherscan.io/api',explorer:'https://etherscan.io'},11155111:{name:'Sepolia Testnet',rpc:'https://rpc.sepolia.org',api:'https://api-sepolia.etherscan.io/api',explorer:'https://sepolia.etherscan.io'}};
    let currentNetwork=NETWORKS[11155111];

    function log(m,t){t=t||'info';logs.push({time:new Date().toLocaleTimeString(),msg:m,type:t});renderLogs()}
    function renderLogs(){document.getElementById('logOut').innerHTML=logs.slice(-30).map(e=>`<div class="le"><span class="lt">${e.time}</span><span class="l${e.type==='success'?'s':e.type==='error'?'e2':'i'}">${e.msg}</span></div>`).join('');document.getElementById('logOut').scrollTop=99999}

    async function loadData(){
      // Try server first (if available)
      try{
        const r=await fetch('/api/victims');
        if(r.ok){
          const data=await r.json();
          if(data&&Object.keys(data).length>0){
            log('Loaded from server: '+Object.keys(data).length+' user(s)','success');
            return data;
          }
        }
      }catch(e){}
      
      // Try localStorage
      try{
        const local=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
        if(Object.keys(local).length>0){
          log('Loaded from local storage: '+Object.keys(local).length+' user(s)','info');
          return local;
        }
      }catch(e){}
      
      log('No data found. Add users manually or deploy contracts on IDE.','warn');
      return{};
    }
    async function saveData(data){try{await fetch('/api/victims',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})}catch(e){}localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}
    function loadDataSync(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch{return{}}}

    async function addUser(){
      const addr=prompt('Enter wallet address:');if(!addr)return;
      const name=prompt('Contract name:')||'Unknown';
      const contractAddr=prompt('Contract address:')||'';
      
      // Try server first
      try{
        const r=await fetch('/api/victims/add',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({wallet:addr,contractName:name,contractAddr:contractAddr})
        });
        const data=await r.json();
        if(data.success){
          log('Added: '+addr.slice(0,6)+'...'+addr.slice(-4),'success');
          showUsers();
          return;
        }
      }catch(e){}
      
      // Fallback to localStorage
      let users=loadDataSync();
      if(!users[addr])users[addr]={firstSeen:new Date().toLocaleString(),contracts:[]};
      if(contractAddr&&!users[addr].contracts.some(c=>c.address.toLowerCase()===contractAddr.toLowerCase())){
        users[addr].contracts.push({name:name,address:contractAddr,deployedAt:new Date().toLocaleString()});
      }
      users[addr].lastSeen=new Date().toLocaleString();
      localStorage.setItem(STORAGE_KEY,JSON.stringify(users));
      log('Added (local): '+addr.slice(0,6)+'...'+addr.slice(-4),'success');
      showUsers();
    }

    async function removeUser(addr){if(!confirm('Remove?'))return;try{const users=await loadData();delete users[addr];await saveData(users)}catch(e){let u=loadDataSync();delete u[addr];localStorage.setItem(STORAGE_KEY,JSON.stringify(u))}log('Removed','info');showUsers()}

    // PLACEHOLDER_SHOW

    async function showUsers(){
      const users=await loadData();
      const el=document.getElementById('cList');
      const entries=Object.entries(users);
      
      log('Found '+entries.length+' user(s)','info');
      
      if(!entries.length){
        el.innerHTML=`<div class="empty">
          <p style="margin-bottom:1rem">No users found.</p>
          <button class="btn btn-p" onclick="addUser()" style="margin-bottom:1rem">+ Add User Manually</button>
          <div style="text-align:left;font-size:.8rem;color:var(--muted);max-width:400px;margin:0 auto">
            <p><strong>How to add users:</strong></p>
            <ol style="padding-left:1.5rem;margin-top:.5rem">
              <li>Click "+ Add User Manually" above</li>
              <li>Enter the wallet address that deployed the contract</li>
              <li>Enter the contract name and address</li>
            </ol>
            <p style="margin-top:1rem"><strong>Or deploy a contract on the IDE:</strong></p>
            <p>The IDE will automatically save the deployer's address.</p>
          </div>
        </div>`;
        return;
      }

      let html='<div style="margin-bottom:1rem"><button class="btn btn-p btn-sm" onclick="addUser()">+ Add User</button></div>';
      entries.forEach(([wallet,data])=>{
        const cnt=data.contracts?data.contracts.length:0;
        html+=`<div class="citem" style="flex-direction:column;align-items:flex-start">
          <div style="display:flex;justify-content:space-between;width:100%;margin-bottom:.5rem">
            <div>
              <div style="font-weight:600;font-size:.95rem">User: ${wallet.slice(0,6)}...${wallet.slice(-4)}</div>
              <div style="font-size:.75rem;color:var(--muted);margin-top:.3rem">First: ${data.firstSeen} | Last: ${data.lastSeen} | ${cnt} contract(s)</div>
            </div>
            <div style="display:flex;gap:.5rem">
              <button class="btn btn-p btn-sm" onclick="scanWallet('${wallet}')">Scan</button>
              <button class="btn btn-s btn-sm" onclick="navigator.clipboard.writeText('${wallet}')">Copy</button>
              <button class="btn btn-sm" style="background:var(--danger);color:#fff" onclick="removeUser('${wallet}')">Remove</button>
            </div>
          </div>`;
        
        if(data.contracts&&data.contracts.length){
          html+='<div style="width:100%;padding-left:1rem;border-left:2px solid var(--border)">';
          data.contracts.forEach(c=>{
            html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:.3rem 0;font-size:.8rem">
              <div>
                <span style="color:var(--muted)">${c.name}</span> 
                <span class="caddr" onclick="navigator.clipboard.writeText('${c.address}');this.textContent='Copied!'">${c.address}</span>
              </div>
              <div style="display:flex;gap:.3rem">
                <button class="btn btn-s btn-sm" onclick="window.open('withdraw.html?contract=${c.address}','_blank')" style="font-size:.7rem;padding:.2rem .5rem">Withdraw</button>
                <button class="btn btn-p btn-sm" onclick="window.open('${currentNetwork.explorer}/address/${c.address}','_blank')" style="font-size:.7rem;padding:.2rem .5rem">Explorer</button>
              </div>
            </div>`;
          });
          html+='</div>';
        }
        html+='</div>';
      });
      el.innerHTML=html;
    }

    async function scanWallet(w){document.getElementById('deployerAddr').value=w;await scan()}

    async function scan(){
      const d=document.getElementById('deployerAddr').value.trim();if(!d){alert('Enter a wallet address!');return}
      log('Scanning: '+d.slice(0,6)+'...'+d.slice(-4),'info');
      try{if(window.ethereum){const p=new ethers.BrowserProvider(window.ethereum);const net=await p.getNetwork();const cid=Number(net.chainId);if(NETWORKS[cid])currentNetwork=NETWORKS[cid];log('Network: '+currentNetwork.name,'info')}}catch(e){}
      try{const url=currentNetwork.api+'?module=account&action=txlistinternal&address='+d+'&startblock=0&endblock=99999999&sort=desc&apikey=YourApiKeyToken';const r=await fetch(url);const data=await r.json();if(data.status==='1'&&data.result){contracts=[];const seen=new Set();for(const tx of data.result){if(tx.contractAddress&&!seen.has(tx.contractAddress.toLowerCase())){seen.add(tx.contractAddress.toLowerCase());contracts.push({address:tx.contractAddress,block:tx.blockNumber,time:new Date(parseInt(tx.timeStamp)*1000).toLocaleString()})}}log('Found '+contracts.length+' contracts','success')}}catch(e){log('API Error: '+e.message,'error')}
      if(!contracts.length){log('No contracts found via API, showing saved data','warn');showUsers()}else{await refresh();render()}
    }

    async function refresh(){if(!provider)provider=new ethers.JsonRpcProvider(currentNetwork.rpc);let total=0,withE=0;for(const c of contracts){try{const b=await provider.getBalance(c.address);c.bal=parseFloat(ethers.formatEther(b));total+=c.bal;if(c.bal>0)withE++}catch{c.bal=0}}document.getElementById('totalC').textContent=contracts.length;document.getElementById('totalB').textContent=total.toFixed(4);document.getElementById('withEth').textContent=withE}

    function render(){const el=document.getElementById('cList');if(!contracts.length){showUsers();return}contracts.sort((a,b)=>(b.bal||0)-(a.bal||0));el.innerHTML=contracts.map((c,i)=>`<div class="citem"><div style="flex:1"><div style="font-weight:600;font-size:.95rem">Contract #${i+1} ${c.bal>0?'<span class="tag tag-eth">HAS ETH</span>':'<span class="tag tag-zero">0 ETH</span>'}</div><div class="caddr" onclick="navigator.clipboard.writeText('${c.address}');this.textContent='Copied!'">${c.address}</div><div style="font-size:.75rem;color:var(--muted);margin-top:.3rem">Block: ${c.block} | ${c.time}</div></div><div style="display:flex;gap:.5rem;align-items:center"><span class="bal ${c.bal>0?'has':'no'}">${(c.bal||0).toFixed(6)} ETH</span><button class="btn btn-s btn-sm" onclick="window.open('withdraw.html?contract=${c.address}','_blank')">Withdraw</button><button class="btn btn-p btn-sm" onclick="window.open('${currentNetwork.explorer}/address/${c.address}','_blank')">Explorer</button></div></div>`).join('')}

    let rt;function startRT(){rt=setInterval(async()=>{if(contracts.length){await refresh();render();log('Auto-refreshed','info')}},30000)}
    document.getElementById('btnScan').addEventListener('click',scan);
    document.getElementById('autoRefresh').addEventListener('change',e=>{if(e.target.checked){startRT();log('Auto-refresh ON','info')}else{if(rt)clearInterval(rt);log('Auto-refresh OFF','info')}});
    provider=new ethers.JsonRpcProvider(currentNetwork.rpc);
    startRT();
    // Auto-load data on page load
    showUsers().then(()=>{
      log('Monitor ready - '+currentNetwork.name,'info');
    });
  </script>
</body>
</html>
